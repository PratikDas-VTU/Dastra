name: dastra
description: "Dastra - Your Offline Productivity Companion"
publish_to: 'none'
version: 1.0.0+100

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.0.0

  # State Management
  provider: ^6.1.2

  # Animations
  flutter_animate: ^4.5.0

  # Google Fonts
  google_fonts: ^6.2.1

  # Icons
  cupertino_icons: ^1.0.8

  # Image processing & utilities
  image: ^4.3.0
  file_picker: ^11.0.2
  path_provider: ^2.1.3
  path: ^1.9.0
  desktop_drop: ^0.7.1
  url_launcher: ^6.3.0
  syncfusion_flutter_pdf: ^33.2.15
  archive: ^4.0.9
  pdfx: ^2.9.2
  get_it: ^9.2.1
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  uuid: ^4.5.3
  shared_preferences: ^2.5.5
  collection: ^1.19.1
  intl: ^0.20.3
  package_info_plus: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

  integration_test:
    sdk: flutter
flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/engines/pdf2docx/
    - assets/engines/pdf_compress/

dependency_overrides:
  path_provider_foundation: 2.3.1
  # Workaround: sqlite3 3.x uses native_assets_cli which fails on Windows when the user path contains spaces.
  sqlite3: ^2.4.6
  sqflite_common_ffi: 2.3.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#1E1E2C"
  image: "assets/images/app_icon.png"
  android_12:
    image: "assets/images/app_icon.png"
    color: "#1E1E2C"
